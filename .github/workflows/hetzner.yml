name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH Connectivity
        shell: bash
        run: |
          set -euo pipefail

          HOST="${{ secrets.SERVER_IP }}"

          echo "Testing TCP/22 to $HOST..."
          if timeout 5 bash -c "echo > /dev/tcp/${HOST}/22" 2>/dev/null; then
            echo "✅ Port 22 is open"
          else
            echo "❌ Port 22 is closed or filtered"
            exit 1
          fi

          echo "Testing SSH auth..."
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$keyfile"
          chmod 600 "$keyfile"

          if timeout 10 ssh -i "$keyfile" -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
            root@"$HOST" "exit"; then
            echo "✅ SSH authentication OK"
          else
            echo "❌ SSH authentication failed"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TOKEN: ${{ secrets.TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_KEY }}
          SOME_API_KEY: ${{ secrets.SOME_API_KEY }}
          RESULT_TOKEN_SIGNING_KEY: ${{ secrets.RESULT_TOKEN_SIGNING_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_HOSTNAME: ${{ secrets.SERVER_HOSTNAME }}
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TOKEN,JWT_SECRET,SOME_API_KEY,RESULT_TOKEN_SIGNING_KEY,SERVER_IP,SERVER_HOSTNAME,CF_ORIGIN_CERT,CF_ORIGIN_KEY
          script: |
            set -e

            # ... keep your existing helper functions and prereqs ...

            APP_DIR="/root/vacation-app"

            if [ ! -d "$APP_DIR" ]; then
              git clone "https://${TOKEN}@github.com/Duzij/VacationOptimizer.git" "$APP_DIR"
            else
              cd "$APP_DIR"
              git reset --hard HEAD
              git clean -fd
              git remote set-url origin "https://${TOKEN}@github.com/Duzij/VacationOptimizer.git"
              git pull
            fi

            cd "$APP_DIR"

            # Write env file for docker compose
            cat > .env <<EOF
            JWT_SECRET_KEY=${JWT_SECRET}
            SOME_API_KEY=${SOME_API_KEY}
            Optimization__ResultTokenSigningKey=${RESULT_TOKEN_SIGNING_KEY}
            ASPNETCORE_ENVIRONMENT=Production
            EOF

            log_info() { echo -e "${BLUE}[INFO]${NC} $1"; }
            log_success() { echo -e "${GREEN}[✓]${NC} $1"; }
            log_error() { echo -e "${RED}[✗]${NC} $1"; exit 1; }

            log_info "Deploying with docker compose..."
            docker compose pull || true
            docker compose up -d --build

            # After docker compose up -d

            log_info "Writing Cloudflare Origin CA certificates..."
            mkdir -p /root/vacation-app/nginx/ssl
            printf '%s\n' "$CF_ORIGIN_CERT" > /root/vacation-app/nginx/ssl/longvacation.eu.pem
            printf '%s\n' "$CF_ORIGIN_KEY" > /root/vacation-app/nginx/ssl/longvacation.eu.key
            chmod 644 /root/vacation-app/nginx/ssl/longvacation.eu.pem
            chmod 600 /root/vacation-app/nginx/ssl/longvacation.eu.key
            log_success "Certificates written to nginx/ssl/"

            log_info "Running diagnostics..."

            # Diagnostic 1: Are containers running?
            log_info "Container status:"
            docker compose ps

            # Diagnostic 2: Is anything listening on 443?
            log_info "Ports listening on 443/80:"
            ss -tlnp | grep -E ':80|:443' || true

            # Diagnostic 3: Can we reach the app directly (bypassing nginx)?
            log_info "Direct backend check (vacation-app:80):"
            docker compose exec -T vacation-app wget -qO- --timeout=5 http://localhost:80/ 2>&1 || log_info "Direct backend check failed (may be normal if no root route)"

            # Diagnostic 4: What SSL files does nginx see?
            log_info "Nginx SSL directory:"
            docker compose exec -T nginx ls -la /etc/nginx/ssl/ 2>&1 || log_info "SSL dir not found inside nginx container"

            # Diagnostic 5: Test HTTPS with full verbose output captured
            log_info "Testing HTTPS (with -k to allow Origin CA / self-signed):"
            HTTPS_LOG="/tmp/https-test.log"
            if curl -vk --max-time 10 \
              --resolve longvacation.eu:443:127.0.0.1 \
              https://longvacation.eu/nginx-health 2>&1 | tee "$HTTPS_LOG"; then
                log_success "HTTPS health endpoint responded"
            else
                CURL_EXIT=$?
                log_info "HTTPS curl exited with code $CURL_EXIT"
                log_info "Last 20 lines of HTTPS attempt:"
                tail -20 "$HTTPS_LOG" || true
            fi

            # Diagnostic 6: Test HTTP fallback
            log_info "Testing HTTP fallback:"
            curl -v --max-time 10 \
              --resolve longvacation.eu:80:127.0.0.1 \
              http://longvacation.eu/nginx-health 2>&1 || log_info "HTTP fallback also failed"

            # Real health check: accept HTTP or HTTPS success
            log_info "Running final health check..."
            for i in {1..10}; do
              HEALTHY=false

              # Try HTTPS first (allowing insecure for Origin CA / localhost check)
              if curl -fsSk --max-time 10 \
                --resolve longvacation.eu:443:127.0.0.1 \
                https://longvacation.eu/nginx-health >/dev/null 2>&1; then
                HEALTHY=true
              fi

              # Fallback to HTTP (in case nginx is in HTTP-only mode)
              if [ "$HEALTHY" != "true" ] && curl -fsS --max-time 10 \
                --resolve longvacation.eu:80:127.0.0.1 \
                http://longvacation.eu/nginx-health >/dev/null 2>&1; then
                HEALTHY=true
              fi

              if [ "$HEALTHY" = "true" ]; then
                log_success "Health check passed (attempt $i)"
                break
              elif [ $i -eq 10 ]; then
                log_error "Health check failed after 10 attempts"
              else
                log_info "Retrying health check... ($i/10)"
                sleep 10
              fi
            done

            log_success "🎉 Deployment completed!"
