# Shared application routes included from the generated HTTP/HTTPS nginx config.

# ═══ Compression for slow connections ═══
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript 
            application/json application/javascript application/xml+rss 
            application/rss+xml application/atom+xml image/svg+xml 
            text/x-component text/x-cross-domain-policy;
gzip_min_length 1024;
gzip_disable "msie6";

# ═══ Caching for versioned static assets (Vite hashes them) ═══
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    proxy_pass http://vacation-app:80$request_uri;
    proxy_http_version 1.1;
    proxy_method GET;    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Long-term caching for hashed assets
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
}

location = /favicon.ico {
    proxy_pass http://vacation-app:80/icons/icon-192.png;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# Well-known root-level static files - add new filenames to the alternation.
location ~ ^/(robots\.txt|ads\.txt|sitemap\.xml|manifest\.json)$ {
    proxy_pass http://vacation-app:80/$1;
    proxy_http_version 1.1;
    proxy_method GET;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    add_header Cache-Control "public, max-age=86400";
    add_header Vary "Accept-Encoding";
}

# The access token is intentionally supplied in the query string, so do not write it
# to nginx's access log. The application additionally applies no-cache and no-referrer
# headers and only returns the cached report from its background check.
location = /api/internal/database-security {
    access_log off;
    proxy_pass http://vacation-app:80;
    proxy_http_version 1.1;
    proxy_method GET;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location /api {
    proxy_pass http://vacation-app:80/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # No caching for API responses
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}

location /app {
    proxy_pass http://vacation-app:80/app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # HTML - revalidate frequently but cache briefly
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Vary "Accept-Encoding";
}

location / {
    proxy_pass http://vacation-app:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # HTML pages - revalidate but cache for 1 hour
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Vary "Accept-Encoding";
}
