name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH Connectivity
        shell: bash
        run: |
          set -euo pipefail

          HOST="${{ secrets.SERVER_IP }}"

          echo "Testing TCP/22 to $HOST..."
          if timeout 5 bash -c "echo > /dev/tcp/${HOST}/22" 2>/dev/null; then
            echo "✅ Port 22 is open"
          else
            echo "❌ Port 22 is closed or filtered"
            exit 1
          fi

          echo "Testing SSH auth..."
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$keyfile"
          chmod 600 "$keyfile"

          if timeout 10 ssh -i "$keyfile" -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
            root@"$HOST" "exit"; then
            echo "✅ SSH authentication OK"
          else
            echo "❌ SSH authentication failed"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TOKEN: ${{ secrets.TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_KEY }}
          SOME_API_KEY: ${{ secrets.SOME_API_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_HOSTNAME: ${{ secrets.SERVER_HOSTNAME }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TOKEN,JWT_SECRET,SOME_API_KEY,SERVER_IP,SERVER_HOSTNAME
          script: |
            set -e

            echo "🚀 Docker Deployment Starting"

            RED='\033[0;31m'
            GREEN='\033[0;32m'
            BLUE='\033[0;34m'
            NC='\033[0m'

            info() { echo -e "${BLUE}[INFO]${NC} $1"; }
            success() { echo -e "${GREEN}[✓]${NC} $1"; }
            error() { echo -e "${RED}[✗]${NC} $1"; exit 1; }

            info "Checking system prerequisites..."

            if ! command -v docker >/dev/null 2>&1; then
              info "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl start docker
              systemctl enable docker
            fi

            apt update -qq && apt install -y git curl >/dev/null 2>&1 || true
            success "System ready"

            info "Configuring GitHub authentication..."
            export GIT_TERMINAL_PROMPT=0
            git config --global credential.helper ""

            APP_DIR="/root/vacation-app"

            if [ ! -d "$APP_DIR" ]; then
              info "Cloning repository..."
              git clone "https://${TOKEN}@github.com/Duzij/VacationOptimizer.git" "$APP_DIR"
            else
              info "Updating repository..."
              cd "$APP_DIR"
              git reset --hard HEAD
              git clean -fd
              git remote set-url origin "https://${TOKEN}@github.com/Duzij/VacationOptimizer.git"
              git pull
            fi

            cd "$APP_DIR"

            info "Building Docker image..."
            docker build -t vacation-app .

            info "Stopping old container..."
            docker stop vacation-app 2>/dev/null || true
            docker rm vacation-app 2>/dev/null || true

            info "Starting new container..."
            docker run -d \
              --name vacation-app \
              -p 80:80 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e JWT_SECRET_KEY=${JWT_SECRET} \
              -e SOME_API_KEY=${SOME_API_KEY} \
              vacation-app

            success "Container started"

            info "Waiting for app to boot..."
            sleep 10

            info "Running health check..."
            for i in {1..5}; do
              if curl -s --max-time 5 http://localhost/api/vacations/countries >/dev/null 2>&1; then
                success "API is healthy"
                break
              elif [ $i -eq 5 ]; then
                error "Health check failed"
              else
                info "Retrying... ($i/5)"
                sleep 5
              fi
            done

            success "🎉 Deployment completed!"

            echo ""
            echo "🌐 Application:"
            echo "   http://${SERVER_IP}"
            echo "   http://${SERVER_IP}/api/vacations/countries"