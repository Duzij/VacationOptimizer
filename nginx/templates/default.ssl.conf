server {
    listen 80;
    server_name longvacation.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name longvacation.eu;

    ssl_certificate /etc/letsencrypt/live/longvacation.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/longvacation.eu/privkey.pem;

    include /etc/nginx/includes/default.conf;
}
