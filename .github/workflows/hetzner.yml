name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH Connectivity
        shell: bash
        run: |
          set -euo pipefail

          HOST="${{ secrets.SERVER_IP }}"

          echo "Testing TCP/22 to $HOST..."
          if timeout 5 bash -c "echo > /dev/tcp/${HOST}/22" 2>/dev/null; then
            echo "✅ Port 22 is open"
          else
            echo "❌ Port 22 is closed or filtered"
            exit 1
          fi

          echo "Testing SSH auth..."
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$keyfile"
          chmod 600 "$keyfile"

          if timeout 10 ssh -i "$keyfile" -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
            root@"$HOST" "exit"; then
            echo "✅ SSH authentication OK"
          else
            echo "❌ SSH authentication failed"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TOKEN: ${{ secrets.TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_KEY }}
          SOME_API_KEY: ${{ secrets.SOME_API_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_HOSTNAME: ${{ secrets.SERVER_HOSTNAME }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TOKEN,JWT_SECRET,SOME_API_KEY,SERVER_IP,SERVER_HOSTNAME
          script: |
            set -e

            # ... keep your existing helper functions and prereqs ...

            APP_DIR="/root/vacation-app"

            if [ ! -d "$APP_DIR" ]; then
              git clone "https://${TOKEN}@github.com/Duzij/VacationOptimizer.git" "$APP_DIR"
            else
              cd "$APP_DIR"
              git reset --hard HEAD
              git clean -fd
              git remote set-url origin "https://${TOKEN}@github.com/Duzij/VacationOptimizer.git"
              git pull
            fi

            cd "$APP_DIR"

            # Write env file for docker compose
            cat > .env <<EOF
            JWT_SECRET_KEY=${JWT_SECRET}
            SOME_API_KEY=${SOME_API_KEY}
            ASPNETCORE_ENVIRONMENT=Production
            EOF

            log_info() { echo -e "${BLUE}[INFO]${NC} $1"; }
            log_success() { echo -e "${GREEN}[✓]${NC} $1"; }
            log_error() { echo -e "${RED}[✗]${NC} $1"; exit 1; }

            log_info "Deploying with docker compose..."
            docker compose pull || true
            docker compose up -d --build

            log_info "Running health check..."
            for i in {1..5}; do
            if curl -s --max-time 5 http://localhost:8080/app >/dev/null 2>&1; then
                log_success "API is healthy"
                break
              elif [ $i -eq 5 ]; then
                log_error "Health check failed"
              else
                log_info "Retrying... ($i/5)"
                sleep 5
              fi
            done

            log_success "🎉 Deployment completed!"

            echo ""
            echo "🌐 Application:"
            echo "   https://${SERVER_IP}"
            echo "   https://${SERVER_IP}/api/vacations/countries"