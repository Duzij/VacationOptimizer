services:
  vacation-app:
    build: .
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-vacation_optimizer};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
      - DatabaseSecurityHealthCheck__AccessToken=${DATABASE_SECURITY_HEALTHCHECK_ACCESS_TOKEN:-}
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-vacation_optimizer}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vacation_optimizer}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    command: ["/bin/sh", "/etc/nginx/start-nginx.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/includes:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/start-nginx.sh:/etc/nginx/start-nginx.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - vacation-app
    restart: always

volumes:
  pgdata:
