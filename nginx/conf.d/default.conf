server {
    listen 80;
    server_name optimize-vacation-for.me;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name optimize-vacation-for.me;

    ssl_certificate /etc/letsencrypt/live/optimize-vacation-for.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optimize-vacation-for.me/privkey.pem;

    location = / {
        return 301 https://$host/app;
    }

    location /api {
        proxy_pass http://vacation-app:80/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app {
        proxy_pass http://vacation-app:80/app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}