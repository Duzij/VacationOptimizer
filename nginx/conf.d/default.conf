# Shared application routes included from the generated HTTP/HTTPS nginx config.

location = / {
    return 301 /app;
}

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# Well-known root-level static files - add new filenames to the alternation.
location ~ ^/(robots\.txt|ads\.txt|sitemap\.xml|favicon\.ico)$ {
    proxy_pass http://vacation-app:80/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api {
    proxy_pass http://vacation-app:80/api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /app {
    proxy_pass http://vacation-app:80/app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
